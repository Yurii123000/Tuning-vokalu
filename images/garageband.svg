<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="ampWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a160c" />
      <stop offset="50%" stop-color="#4a2717" />
      <stop offset="100%" stop-color="#2a160c" />
    </linearGradient>
    <linearGradient id="trackBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="trackPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="trackOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="gbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#gbBg)" />

  <!-- GarageBand Top Bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#1e293b" />
  <rect x="0" y="55" width="1200" height="1" fill="#334155" />

  <!-- Apple Window Dots -->
  <circle cx="20" cy="28" r="6" fill="#ef4444" />
  <circle cx="38" cy="28" r="6" fill="#f59e0b" />
  <circle cx="56" cy="28" r="6" fill="#10b981" />

  <!-- GarageBand Guitar Amp Icon & Title -->
  <g transform="translate(80, 12)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#ea580c" filter="url(#gbGlow)"/>
    <!-- Guitar / pick shape -->
    <path d="M 16 6 C 22 6, 26 12, 24 20 C 22 26, 16 28, 16 28 C 16 28, 10 26, 8 20 C 6 12, 10 6, 16 6 Z" fill="#ffffff"/>
    <text x="42" y="22" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="18">GarageBand Studio Pro</text>
    <text x="260" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12">[ARRANGEMENT &amp; PRODUCTION]</text>
  </g>

  <!-- Central LCD Display (GarageBand Signature) -->
  <g transform="translate(520, 10)">
    <rect x="0" y="0" width="280" height="36" rx="6" fill="#08101a" stroke="#0284c7" stroke-width="1.5" />
    <!-- Bar : Beat : Division : Tick -->
    <text x="20" y="24" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">001. 1. 1. 001</text>
    <text x="160" y="24" fill="#fb923c" font-family="monospace" font-size="15" font-weight="bold">120 BPM</text>
    <text x="235" y="24" fill="#4ade80" font-family="monospace" font-size="15" font-weight="bold">C maj</text>
  </g>

  <!-- Transport Buttons -->
  <g transform="translate(830, 14)">
    <!-- Rewind -->
    <circle cx="20" cy="14" r="14" fill="#334155" />
    <polygon points="17,14 25,9 25,19" fill="#e2e8f0"/>
    <polygon points="11,14 19,9 19,19" fill="#e2e8f0"/>
    <!-- Play -->
    <circle cx="58" cy="14" r="16" fill="#0284c7" filter="url(#gbGlow)"/>
    <polygon points="54,8 66,14 54,20" fill="#ffffff"/>
    <!-- Record -->
    <circle cx="96" cy="14" r="14" fill="#334155" />
    <circle cx="96" cy="14" r="7" fill="#ef4444" />
    <!-- Cycle / Loop -->
    <circle cx="134" cy="14" r="14" fill="#ea580c" />
    <path d="M 128 14 A 6 6 0 1 1 138 18" fill="none" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Left: Track Headers Column -->
  <g transform="translate(0, 56)">
    <rect width="250" height="644" fill="#0f172a" stroke="#1e293b" />
    <text x="18" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">TRACK HEADER</text>

    <!-- Track 1: Lead Vocal -->
    <g transform="translate(0, 40)">
      <rect width="250" height="85" fill="#132338" stroke="#0284c7" stroke-width="0.5"/>
      <circle cx="35" cy="42" r="18" fill="#0284c7" filter="url(#gbGlow)"/>
      <!-- Mic icon -->
      <rect x="32" y="32" width="6" height="12" rx="3" fill="#ffffff" />
      <path d="M 29 39 A 6 6 0 0 0 41 39" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="65" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Lead Vocal (Tuned)</text>
      <text x="65" y="52" fill="#38bdf8" font-family="sans-serif" font-size="10">Melodyne + Reverb FX</text>
      <!-- Mute / Solo buttons -->
      <rect x="65" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="72" y="72" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">M</text>
      <rect x="92" y="60" width="22" height="16" rx="3" fill="#fb923c" />
      <text x="100" y="72" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">S</text>
    </g>

    <!-- Track 2: Yamaha Synth Accompaniment -->
    <g transform="translate(0, 126)">
      <rect width="250" height="85" fill="#101c2e" stroke="#1e3a5f" stroke-width="0.5"/>
      <circle cx="35" cy="42" r="18" fill="#ea580c"/>
      <!-- Keyboard icon -->
      <rect x="25" y="34" width="20" height="14" rx="2" fill="#ffffff"/>
      <line x1="30" y1="34" x2="30" y2="42" stroke="#000" stroke-width="1"/>
      <line x1="35" y1="34" x2="35" y2="42" stroke="#000" stroke-width="1"/>
      <line x1="40" y1="34" x2="40" y2="42" stroke="#000" stroke-width="1"/>
      <text x="65" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Yamaha Synth Pad</text>
      <text x="65" y="52" fill="#fb923c" font-family="sans-serif" font-size="10">Stereo Grand &amp; Strings</text>
      <rect x="65" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="72" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">M</text>
      <rect x="92" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="100" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">S</text>
    </g>

    <!-- Track 3: Suno AI Arrangement -->
    <g transform="translate(0, 212)">
      <rect width="250" height="85" fill="#1a1528" stroke="#db2777" stroke-width="0.5"/>
      <circle cx="35" cy="42" r="18" fill="#db2777" filter="url(#gbGlow)"/>
      <circle cx="35" cy="42" r="6" fill="#ffffff" />
      <text x="65" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Suno AI Backing</text>
      <text x="65" y="52" fill="#f472b6" font-family="sans-serif" font-size="10">Full Arrangement Base</text>
      <rect x="65" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="72" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">M</text>
      <rect x="92" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="100" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">S</text>
    </g>

    <!-- Track 4: Acoustic Guitar -->
    <g transform="translate(0, 298)">
      <rect width="250" height="85" fill="#101c2e" stroke="#1e3a5f" stroke-width="0.5"/>
      <circle cx="35" cy="42" r="18" fill="#0284c7"/>
      <!-- Guitar pick -->
      <polygon points="35,30 43,48 27,48" fill="#ffffff"/>
      <text x="65" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Acoustic Guitar</text>
      <text x="65" y="52" fill="#38bdf8" font-family="sans-serif" font-size="10">Warm Room Stereo</text>
      <rect x="65" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="72" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">M</text>
      <rect x="92" y="60" width="22" height="16" rx="3" fill="#1e3a5f" />
      <text x="100" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">S</text>
    </g>

    <!-- Vintage Amp / Pedals at bottom -->
    <g transform="translate(15, 395)">
      <rect width="220" height="235" rx="8" fill="url(#ampWood)" stroke="#63391d" stroke-width="3"/>
      <!-- Grill cloth -->
      <rect x="10" y="55" width="200" height="165" rx="4" fill="#1c1917" stroke="#78350f"/>
      <text x="35" y="35" fill="#fde047" font-family="serif" font-size="15" font-weight="bold">TUBE PREAMP 60W</text>
      <!-- Knobs on amp -->
      <g transform="translate(30, 95)">
        <circle cx="0" cy="0" r="15" fill="#44403c" stroke="#d6d3d1" stroke-width="2"/>
        <line x1="0" y1="0" x2="-8" y2="-8" stroke="#fbbf24" stroke-width="2"/>
        <text x="-14" y="24" fill="#a8a29e" font-family="sans-serif" font-size="8">DRIVE</text>
      </g>
      <g transform="translate(85, 95)">
        <circle cx="0" cy="0" r="15" fill="#44403c" stroke="#d6d3d1" stroke-width="2"/>
        <line x1="0" y1="0" x2="6" y2="-9" stroke="#fbbf24" stroke-width="2"/>
        <text x="-12" y="24" fill="#a8a29e" font-family="sans-serif" font-size="8">TONE</text>
      </g>
      <g transform="translate(140, 95)">
        <circle cx="0" cy="0" r="15" fill="#44403c" stroke="#d6d3d1" stroke-width="2"/>
        <line x1="0" y1="0" x2="8" y2="4" stroke="#fbbf24" stroke-width="2"/>
        <text x="-14" y="24" fill="#a8a29e" font-family="sans-serif" font-size="8">REVERB</text>
      </g>
      <!-- Amp Status Light -->
      <circle cx="185" cy="30" r="6" fill="#ef4444" filter="url(#gbGlow)"/>
    </g>
  </g>

  <!-- Right: Arranger Timeline & Audio Waveform Blocks -->
  <g transform="translate(250, 56)">
    <!-- Timeline Ruler -->
    <rect width="950" height="35" fill="#0b1320" />
    <g stroke="#334155" stroke-width="1">
      <line x1="100" y1="20" x2="100" y2="35"/>
      <line x1="250" y1="15" x2="250" y2="35" stroke="#38bdf8" stroke-width="2"/>
      <text x="245" y="12" fill="#38bdf8" font-family="sans-serif" font-size="10">2</text>
      <line x1="400" y1="20" x2="400" y2="35"/>
      <line x1="550" y1="15" x2="550" y2="35" stroke="#38bdf8" stroke-width="2"/>
      <text x="545" y="12" fill="#38bdf8" font-family="sans-serif" font-size="10">4</text>
      <line x1="700" y1="20" x2="700" y2="35"/>
      <line x1="850" y1="15" x2="850" y2="35" stroke="#38bdf8" stroke-width="2"/>
      <text x="845" y="12" fill="#38bdf8" font-family="sans-serif" font-size="10">6</text>
    </g>

    <!-- Cycle Region (Orange glowing bar on top) -->
    <rect x="250" y="30" width="450" height="5" fill="#ea580c" filter="url(#gbGlow)"/>

    <!-- Track 1 Audio Region (Vocal Waveform) -->
    <g transform="translate(0, 40)">
      <rect width="950" height="85" fill="#08101a" />
      <rect x="80" y="8" width="820" height="68" rx="6" fill="url(#trackBlue)" opacity="0.9" filter="url(#gbGlow)"/>
      <text x="95" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Studio Lead Vocal_Tuned_Take04.wav</text>
      <!-- Audio Waveform Visualization -->
      <path d="M 90 42 
               Q 110 20, 130 42 T 160 15 T 190 42 T 220 22 T 250 42 
               T 280 12 T 310 42 T 340 18 T 370 42 T 400 10 T 430 42
               T 460 15 T 490 42 T 520 20 T 550 42 T 580 10 T 610 42
               T 640 16 T 670 42 T 700 22 T 730 42 T 760 12 T 790 42
               T 820 18 T 850 42 T 880 25 T 895 42" 
            fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Track 2 Synth MIDI Block -->
    <g transform="translate(0, 126)">
      <rect width="950" height="85" fill="#060c14" />
      <rect x="40" y="8" width="870" height="68" rx="6" fill="url(#trackOrange)" opacity="0.9"/>
      <text x="55" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Yamaha Motif XF7 - Ambient Pad Progression</text>
      <!-- MIDI Bars -->
      <g fill="#ffffff" opacity="0.85">
        <rect x="60" y="32" width="60" height="8" rx="2"/>
        <rect x="130" y="42" width="75" height="8" rx="2"/>
        <rect x="220" y="28" width="90" height="8" rx="2"/>
        <rect x="330" y="36" width="65" height="8" rx="2"/>
        <rect x="410" y="46" width="85" height="8" rx="2"/>
        <rect x="520" y="26" width="110" height="8" rx="2"/>
        <rect x="650" y="38" width="80" height="8" rx="2"/>
        <rect x="750" y="44" width="95" height="8" rx="2"/>
      </g>
    </g>

    <!-- Track 3 Suno AI Instrumentals -->
    <g transform="translate(0, 212)">
      <rect width="950" height="85" fill="#08101a" />
      <rect x="15" y="8" width="910" height="68" rx="6" fill="url(#trackPink)" opacity="0.9" filter="url(#gbGlow)"/>
      <text x="30" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Suno AI_Music_V3_Remastered_Instrumental.wav</text>
      <!-- Rich Waveform -->
      <path d="M 25 42 
               Q 45 15, 65 42 T 95 10 T 125 42 T 155 18 T 185 42 
               T 215 12 T 245 42 T 275 14 T 305 42 T 335 8 T 365 42
               T 395 16 T 425 42 T 455 12 T 485 42 T 515 8 T 545 42
               T 575 14 T 605 42 T 635 18 T 665 42 T 695 10 T 725 42
               T 755 16 T 785 42 T 815 12 T 845 42 T 875 15 T 905 42" 
            fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Track 4 Guitar Track -->
    <g transform="translate(0, 298)">
      <rect width="950" height="85" fill="#060c14" />
      <rect x="160" y="8" width="720" height="68" rx="6" fill="url(#trackBlue)" opacity="0.75"/>
      <text x="175" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Acoustic Strum 08_HighEQ.wav</text>
      <path d="M 170 42 Q 190 22, 210 42 T 240 25 T 270 42 T 300 20 T 330 42 T 360 26 T 390 42 T 420 18 T 450 42 T 480 22 T 510 42 T 540 18 T 570 42 T 600 24 T 630 42 T 660 16 T 690 42 T 720 22 T 750 42 T 780 20 T 810 42 T 840 26 T 870 42" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Smart Controls / Big EQ Display Panel at Bottom -->
    <g transform="translate(20, 400)">
      <rect width="910" height="230" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">GARAGEBAND SMART CONTROLS &amp; MASTER BUS</text>

      <!-- Graphical EQ Display -->
      <g transform="translate(30, 48)">
        <rect width="400" height="150" rx="6" fill="#090d14" stroke="#0284c7" />
        <path d="M 10 130 C 60 130, 100 90, 150 70 C 220 40, 280 80, 340 50 L 390 45" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#gbGlow)"/>
        <text x="15" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11">Visual EQ Active</text>
        <circle cx="150" cy="70" r="6" fill="#fb923c" />
        <circle cx="340" cy="50" r="6" fill="#f472b6" />
      </g>

      <!-- Reverb & Compressor Modules -->
      <g transform="translate(470, 48)">
        <rect width="410" height="150" rx="6" fill="#090d14" stroke="#db2777" />
        <text x="20" y="25" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">SPACE DESIGNER REVERB &amp; BUS COMPRESSOR</text>

        <!-- Big Knobs -->
        <g transform="translate(60, 85)">
          <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
          <line x1="0" y1="0" x2="10" y2="-18" stroke="#38bdf8" stroke-width="3"/>
          <text x="-25" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">REVERB TIME</text>
          <text x="-16" y="58" fill="#38bdf8" font-family="sans-serif" font-size="10">2.4 s</text>
        </g>

        <g transform="translate(180, 85)">
          <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#fb923c" stroke-width="3"/>
          <line x1="0" y1="0" x2="-14" y2="-15" stroke="#fb923c" stroke-width="3"/>
          <text x="-25" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">PRE-DELAY</text>
          <text x="-14" y="58" fill="#fb923c" font-family="sans-serif" font-size="10">35 ms</text>
        </g>

        <g transform="translate(300, 85)">
          <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
          <line x1="0" y1="0" x2="16" y2="-8" stroke="#f472b6" stroke-width="3"/>
          <text x="-22" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">WET / DRY</text>
          <text x="-14" y="58" fill="#f472b6" font-family="sans-serif" font-size="10">28 %</text>
        </g>
      </g>
    </g>

    <!-- Arranger Playhead -->
    <g transform="translate(420, 0)">
      <line x1="0" y1="0" x2="0" y2="395" stroke="#38bdf8" stroke-width="2" filter="url(#gbGlow)"/>
      <polygon points="-6,0 6,0 0,10" fill="#38bdf8" />
    </g>

  </g>
</svg>
