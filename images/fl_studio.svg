<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d253f" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#ff73b3" />
    </linearGradient>
    <linearGradient id="faderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#ff7e40" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <pattern id="dawGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="700" fill="url(#dawGrid)" />
  </g>

  <!-- Header / Top Bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#091424" />
  <rect x="0" y="50" width="1200" height="2" fill="#0284c7" />

  <!-- FL Pepper Icon & Title -->
  <g transform="translate(24, 10)">
    <path d="M16 4 C10 10, 4 18, 12 28 C18 36, 26 28, 24 18 C22 10, 18 4, 16 4 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <path d="M16 4 C18 1, 22 2, 24 6 C20 6, 17 5, 16 4 Z" fill="#22c55e" />
    <text x="36" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="1">FL STUDIO 24 PRO</text>
    <text x="215" y="24" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12">[PROJECT: VOCAL_PRODUCE_MASTER]</text>
  </g>

  <!-- Transport Controls -->
  <g transform="translate(620, 14)">
    <rect x="0" y="0" width="34" height="24" rx="4" fill="#0f2b48" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="12,7 24,12 12,17" fill="#38bdf8" />
    
    <rect x="42" y="0" width="34" height="24" rx="4" fill="#0f2b48" stroke="#38bdf8" stroke-width="1"/>
    <rect x="54" y="7" width="10" height="10" fill="#f43f5e" />
    
    <rect x="84" y="0" width="34" height="24" rx="4" fill="#0f2b48" stroke="#ff2a85" stroke-width="1"/>
    <circle cx="101" cy="12" r="5" fill="#ff2a85" filter="url(#glow)"/>

    <text x="135" y="17" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">128.000 BPM</text>
    <text x="250" y="17" fill="#ff7e40" font-family="monospace" font-size="16" font-weight="bold">4/4 TIME</text>
  </g>

  <!-- Channel Rack (Left Panel) -->
  <g transform="translate(25, 75)">
    <rect width="360" height="595" rx="8" fill="#0c1d33" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="360" height="34" rx="8" fill="#112744" />
    <text x="16" y="23" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">CHANNEL RACK &amp; INSTRUMENTS</text>

    <!-- Channels -->
    <!-- 1: Lead Vocal -->
    <g transform="translate(12, 45)">
      <rect width="130" height="42" rx="4" fill="#133156" stroke="#00e5ff" stroke-width="1"/>
      <circle cx="18" cy="21" r="5" fill="#00e5ff" filter="url(#glow)"/>
      <text x="32" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Lead Vocal FX</text>
      <!-- Step Sequencer Pads -->
      <g transform="translate(140, 7)">
        <rect x="0" y="0" width="22" height="28" rx="3" fill="#0284c7" />
        <rect x="25" y="0" width="22" height="28" rx="3" fill="#0284c7" />
        <rect x="50" y="0" width="22" height="28" rx="3" fill="#0284c7" />
        <rect x="75" y="0" width="22" height="28" rx="3" fill="#0284c7" />
        <rect x="105" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="130" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="155" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="180" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
      </g>
    </g>

    <!-- 2: Melodyne Track -->
    <g transform="translate(12, 95)">
      <rect width="130" height="42" rx="4" fill="#133156" stroke="#ff7e40" stroke-width="1"/>
      <circle cx="18" cy="21" r="5" fill="#ff7e40" filter="url(#glow)"/>
      <text x="32" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Melodyne VST</text>
      <g transform="translate(140, 7)">
        <rect x="0" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="25" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="50" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="75" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="105" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="130" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="155" y="0" width="22" height="28" rx="3" fill="#ff7e40" />
        <rect x="180" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
      </g>
    </g>

    <!-- 3: Suno Stem Track -->
    <g transform="translate(12, 145)">
      <rect width="130" height="42" rx="4" fill="#133156" stroke="#ec4899" stroke-width="1"/>
      <circle cx="18" cy="21" r="5" fill="#ec4899"/>
      <text x="32" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Suno AI Audio</text>
      <g transform="translate(140, 7)">
        <rect x="0" y="0" width="22" height="28" rx="3" fill="#ec4899" />
        <rect x="25" y="0" width="22" height="28" rx="3" fill="#ec4899" />
        <rect x="50" y="0" width="22" height="28" rx="3" fill="#ec4899" />
        <rect x="75" y="0" width="22" height="28" rx="3" fill="#ec4899" />
        <rect x="105" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="130" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="155" y="0" width="22" height="28" rx="3" fill="#ec4899" />
        <rect x="180" y="0" width="22" height="28" rx="3" fill="#ec4899" />
      </g>
    </g>

    <!-- 4: Yamaha Synth In -->
    <g transform="translate(12, 195)">
      <rect width="130" height="42" rx="4" fill="#133156" stroke="#00e5ff" stroke-width="1"/>
      <circle cx="18" cy="21" r="5" fill="#00e5ff"/>
      <text x="32" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Yamaha Synth</text>
      <g transform="translate(140, 7)">
        <rect x="0" y="0" width="22" height="28" rx="3" fill="#00e5ff" />
        <rect x="25" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="50" y="0" width="22" height="28" rx="3" fill="#00e5ff" />
        <rect x="75" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="105" y="0" width="22" height="28" rx="3" fill="#00e5ff" />
        <rect x="130" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
        <rect x="155" y="0" width="22" height="28" rx="3" fill="#00e5ff" />
        <rect x="180" y="0" width="22" height="28" rx="3" fill="#1e3a5f" />
      </g>
    </g>

    <!-- Mini Piano Roll inside FL -->
    <g transform="translate(12, 255)">
      <rect width="336" height="325" rx="6" fill="#081424" stroke="#1d3d63" />
      <text x="12" y="20" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">PIANO ROLL - VOCAL PITCH EDIT</text>
      <!-- Grid Lines -->
      <g opacity="0.25" stroke="#38bdf8">
        <line x1="10" y1="40" x2="326" y2="40" />
        <line x1="10" y1="70" x2="326" y2="70" />
        <line x1="10" y1="100" x2="326" y2="100" />
        <line x1="10" y1="130" x2="326" y2="130" />
        <line x1="10" y1="160" x2="326" y2="160" />
        <line x1="10" y1="190" x2="326" y2="190" />
        <line x1="10" y1="220" x2="326" y2="220" />
        <line x1="10" y1="250" x2="326" y2="250" />
        <line x1="10" y1="280" x2="326" y2="280" />
      </g>
      <!-- Piano Keys on Left -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="24" height="15" fill="#f8fafc" stroke="#334155"/>
        <rect x="0" y="15" width="16" height="12" fill="#0f172a" />
        <rect x="0" y="27" width="24" height="15" fill="#f8fafc" stroke="#334155"/>
        <rect x="0" y="42" width="16" height="12" fill="#0f172a" />
        <rect x="0" y="54" width="24" height="15" fill="#f8fafc" stroke="#334155"/>
        <rect x="0" y="69" width="24" height="15" fill="#f8fafc" stroke="#334155"/>
        <rect x="0" y="84" width="16" height="12" fill="#0f172a" />
        <rect x="0" y="96" width="24" height="15" fill="#f8fafc" stroke="#334155"/>
      </g>
      <!-- Melodic Notes (Glowing Cyan & Pink) -->
      <rect x="45" y="40" width="55" height="12" rx="3" fill="#00f2fe" filter="url(#glow)"/>
      <rect x="105" y="60" width="45" height="12" rx="3" fill="#00f2fe" />
      <rect x="155" y="85" width="60" height="12" rx="3" fill="#ff7e40" filter="url(#glow)"/>
      <rect x="220" y="45" width="40" height="12" rx="3" fill="#ec4899" filter="url(#glow)"/>
      <rect x="265" y="70" width="55" height="12" rx="3" fill="#00f2fe" />
      <rect x="70" y="145" width="80" height="14" rx="3" fill="#38bdf8" />
      <rect x="160" y="165" width="65" height="14" rx="3" fill="#ff7e40" />
      <rect x="235" y="195" width="75" height="14" rx="3" fill="#00f2fe" />
    </g>
  </g>

  <!-- FL Mixer Console (Right Large Panel) -->
  <g transform="translate(410, 75)">
    <rect width="765" height="595" rx="8" fill="#0c1d33" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="765" height="34" rx="8" fill="#112744" />
    <text x="20" y="23" fill="#00e5ff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14">FL STUDIO MIXER &amp; MASTERING RACK (REVERB • DELAY • COMPRESSOR • EQ)</text>

    <!-- Mixer Channels -->
    <!-- Ch 1: Master -->
    <g transform="translate(25, 50)">
      <rect width="75" height="520" rx="6" fill="#0f2642" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="16" y="24" fill="#00e5ff" font-family="sans-serif" font-size="12" font-weight="bold">MASTER</text>
      <!-- VU Meter -->
      <rect x="16" y="45" width="16" height="340" rx="3" fill="#071526" />
      <rect x="16" y="120" width="16" height="265" rx="3" fill="url(#faderGrad)" />
      <!-- Fader Track -->
      <rect x="46" y="45" width="8" height="340" rx="4" fill="#061220" />
      <!-- Fader Handle -->
      <rect x="36" y="150" width="28" height="45" rx="4" fill="#38bdf8" filter="url(#glow)"/>
      <line x1="38" y1="172" x2="62" y2="172" stroke="#051329" stroke-width="2"/>
      <text x="18" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">0.0 dB</text>
      <rect x="10" y="445" width="55" height="24" rx="4" fill="#0284c7" />
      <text x="24" y="461" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">MUTE</text>
      <rect x="10" y="475" width="55" height="24" rx="4" fill="#ff7e40" />
      <text x="24" y="491" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">SOLO</text>
    </g>

    <!-- Ch 2: Melodyne Vocal Tuned -->
    <g transform="translate(120, 50)">
      <rect width="75" height="520" rx="6" fill="#0f2642" stroke="#ff7e40" stroke-width="1"/>
      <text x="10" y="24" fill="#ff7e40" font-family="sans-serif" font-size="11" font-weight="bold">MELODYNE</text>
      <rect x="16" y="45" width="16" height="340" rx="3" fill="#071526" />
      <rect x="16" y="150" width="16" height="235" rx="3" fill="url(#orangeGrad)" />
      <rect x="46" y="45" width="8" height="340" rx="4" fill="#061220" />
      <rect x="36" y="180" width="28" height="45" rx="4" fill="#ff7e40" filter="url(#glow)"/>
      <line x1="38" y1="202" x2="62" y2="202" stroke="#051329" stroke-width="2"/>
      <text x="18" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">-1.5 dB</text>
      <rect x="10" y="445" width="55" height="24" rx="4" fill="#1e3a5f" />
      <text x="24" y="461" fill="#94a3b8" font-family="sans-serif" font-size="10">MUTE</text>
      <rect x="10" y="475" width="55" height="24" rx="4" fill="#ff7e40" />
      <text x="24" y="491" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">SOLO</text>
    </g>

    <!-- Ch 3: Reverb FX -->
    <g transform="translate(215, 50)">
      <rect width="75" height="520" rx="6" fill="#0f2642" stroke="#ec4899" stroke-width="1"/>
      <text x="12" y="24" fill="#ec4899" font-family="sans-serif" font-size="11" font-weight="bold">REVERB</text>
      <rect x="16" y="45" width="16" height="340" rx="3" fill="#071526" />
      <rect x="16" y="200" width="16" height="185" rx="3" fill="url(#pinkGrad)" />
      <rect x="46" y="45" width="8" height="340" rx="4" fill="#061220" />
      <rect x="36" y="220" width="28" height="45" rx="4" fill="#ec4899" filter="url(#glow)"/>
      <line x1="38" y1="242" x2="62" y2="242" stroke="#051329" stroke-width="2"/>
      <text x="18" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">-6.0 dB</text>
    </g>

    <!-- Ch 4: Delay FX -->
    <g transform="translate(310, 50)">
      <rect width="75" height="520" rx="6" fill="#0f2642" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">DELAY</text>
      <rect x="16" y="45" width="16" height="340" rx="3" fill="#071526" />
      <rect x="16" y="230" width="16" height="155" rx="3" fill="url(#cyanGrad)" />
      <rect x="46" y="45" width="8" height="340" rx="4" fill="#061220" />
      <rect x="36" y="240" width="28" height="45" rx="4" fill="#38bdf8" />
      <line x1="38" y1="262" x2="62" y2="262" stroke="#051329" stroke-width="2"/>
      <text x="18" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">-8.2 dB</text>
    </g>

    <!-- Right Side: Parametric EQ 2 / Compressor Display -->
    <g transform="translate(405, 50)">
      <rect width="335" height="250" rx="6" fill="#091729" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">FRUITY PARAMETRIC EQ 2 - VOCAL CURVE</text>
      
      <!-- EQ Curve & Spectrum -->
      <path d="M 20 200 C 60 200, 80 185, 110 120 C 150 50, 190 140, 240 100 C 270 70, 300 80, 320 85" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#glow)"/>
      <path d="M 20 200 C 60 200, 80 185, 110 120 C 150 50, 190 140, 240 100 C 270 70, 300 80, 320 85 L 320 230 L 20 230 Z" fill="#00f2fe" opacity="0.1"/>
      
      <!-- Frequency Points -->
      <circle cx="110" cy="120" r="7" fill="#ff7e40" stroke="#fff" stroke-width="2" />
      <text x="95" y="105" fill="#ff7e40" font-family="sans-serif" font-size="10" font-weight="bold">High Pass</text>
      
      <circle cx="240" cy="100" r="7" fill="#ec4899" stroke="#fff" stroke-width="2" />
      <text x="215" y="85" fill="#ec4899" font-family="sans-serif" font-size="10" font-weight="bold">+3.5dB Air</text>

      <!-- Frequency Grid -->
      <text x="25" y="225" fill="#475569" font-family="sans-serif" font-size="9">20Hz</text>
      <text x="100" y="225" fill="#475569" font-family="sans-serif" font-size="9">200Hz</text>
      <text x="190" y="225" fill="#475569" font-family="sans-serif" font-size="9">2kHz</text>
      <text x="280" y="225" fill="#475569" font-family="sans-serif" font-size="9">20kHz</text>
    </g>

    <!-- Compressor & Limiter Rack -->
    <g transform="translate(405, 315)">
      <rect width="335" height="255" rx="6" fill="#091729" stroke="#ec4899" stroke-width="1.5"/>
      <text x="16" y="25" fill="#ff73b3" font-family="sans-serif" font-size="12" font-weight="bold">VOCAL COMPRESSOR &amp; DE-ESSER</text>

      <!-- Dials / Knobs -->
      <!-- Threshold Knob -->
      <g transform="translate(50, 80)">
        <circle cx="0" cy="0" r="28" fill="#132b49" stroke="#ff7e40" stroke-width="3"/>
        <line x1="0" y1="0" x2="-14" y2="-18" stroke="#ff7e40" stroke-width="3" stroke-linecap="round"/>
        <text x="-25" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">THRESH</text>
        <text x="-20" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10">-18 dB</text>
      </g>

      <!-- Ratio Knob -->
      <g transform="translate(135, 80)">
        <circle cx="0" cy="0" r="28" fill="#132b49" stroke="#00e5ff" stroke-width="3"/>
        <line x1="0" y1="0" x2="16" y2="-12" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
        <text x="-20" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">RATIO</text>
        <text x="-16" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10">4.2 : 1</text>
      </g>

      <!-- Attack Knob -->
      <g transform="translate(220, 80)">
        <circle cx="0" cy="0" r="28" fill="#132b49" stroke="#ec4899" stroke-width="3"/>
        <line x1="0" y1="0" x2="-8" y2="-20" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
        <text x="-22" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">ATTACK</text>
        <text x="-16" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10">15 ms</text>
      </g>

      <!-- Gain Reduction Meter -->
      <g transform="translate(25, 170)">
        <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">GAIN REDUCTION (GR)</text>
        <rect x="0" y="24" width="285" height="18" rx="4" fill="#05101d" stroke="#1e3a5f" />
        <rect x="0" y="24" width="190" height="18" rx="4" fill="url(#pinkGrad)" filter="url(#glow)"/>
        <text x="195" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">-4.5 dB</text>
      </g>
    </g>

  </g>
</svg>
